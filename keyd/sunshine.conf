# Sunshine's virtual keyboard (libvirtualhid, used by every Sunshine instance).
# An explicit ID wins over default.conf's wildcard, so default.conf's
# mappings are repeated here.
[ids]
1209:0002

[main]
# Tap for ` / ~, hold as another Super key (same as default.conf).
grave = overload(meta, grave)
# Stream clients can't always send Win (Windows keeps it), so Caps Lock is Super.
capslock = layer(meta)
